name: Deploy

on:
  push:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time — cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # ── Rebuild manifests ──────────────────────────────────────────────
      # Generates dogs/memorial/team manifests at deploy time — not committed.
      - name: Rebuild manifests
        run: node .github/scripts/rebuild-manifests.js

      # ── Sync Cloudinary fallbacks ──────────────────────────────────────
      # Downloads local copies of Cloudinary images so the site has fallbacks.
      # Hard timeout of 4 minutes. Non-fatal: missing fallbacks are acceptable
      # because Cloudinary is the primary image source.
      - name: Sync Cloudinary images to local fallback
        run: node .github/scripts/sync-images.js
        timeout-minutes: 4
        continue-on-error: true

      # ── Inject runtime credentials ─────────────────────────────────────
      # Tokens are stored in GitHub → Settings → Secrets and variables →
      # Actions → Variables (non-secret) and Secrets (sensitive).
      # None of these values are committed to the repository.
      - name: Inject environment variables
        env:
          SUPABASE_URL:              ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME:     ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:        ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_UPLOAD_PRESET:  ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g"                     admin/index.html
          sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g"           admin/index.html
          sed -i "s|__CLOUDINARY_CLOUD_NAME__|${CLOUDINARY_CLOUD_NAME}|g"   admin/cms-config.js
          sed -i "s|__CLOUDINARY_API_KEY__|${CLOUDINARY_API_KEY}|g"         admin/cms-config.js
          sed -i "s|__CLOUDINARY_UPLOAD_PRESET__|${CLOUDINARY_UPLOAD_PRESET}|g" admin/cms-config.js
          sed -i "s|__CLOUDINARY_CLOUD_NAME__|${CLOUDINARY_CLOUD_NAME}|g"   js/gallery.js

      # ── Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
