name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # ── Rebuild manifests ──────────────────────────────────────────────
      - name: Rebuild manifests
        run: node .github/scripts/rebuild-manifests.js

      # ── Sync Cloudinary fallbacks ──────────────────────────────────────
      - name: Sync Cloudinary images to local fallback
        run: node .github/scripts/sync-images.js
        timeout-minutes: 4
        continue-on-error: true

      # ── Generate runtime config ────────────────────────────────────────
      # Writes admin/config.js and js/site-config.js — never committed.
      # Also stamps a build timestamp in admin/index.html for cache-busting.
      - name: Generate runtime config
        env:
          SUPABASE_URL:              ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME:     ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:        ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_UPLOAD_PRESET:  ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: node .github/scripts/generate-config.js

      # ── Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
